# Docker Hub 멀티아치 이미지 퍼블리시.
# 트리거: git 태그 push (v*), 또는 수동 실행(workflow_dispatch).
# 사전 준비(사용자): Docker Hub 계정 + 저장소 Settings에 아래 secret/variable 등록
#   - secret  DOCKERHUB_TOKEN     : Docker Hub Access Token (Read&Write)
#   - variable DOCKERHUB_USERNAME : Docker Hub 사용자/조직명 (= 이미지 네임스페이스)
# 이미지: <DOCKERHUB_USERNAME>/dbflow (web+api 단일 이미지)
name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "이미지 태그 (예: v0.1.0). 비우면 'manual'"
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub 자격증명 확인
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME(variable)와 DOCKERHUB_TOKEN(secret)을 저장소 설정에 등록하세요."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 태그 산출 (metadata)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/dbflow
          # v1.2.3 → 1.2.3, 1.2, 1 + latest. 수동 실행은 입력값 또는 'manual'.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ github.event.inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 빌드 & 푸시 (amd64/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
